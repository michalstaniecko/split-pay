# Local development services. Start with `pnpm db:up`.
# A fixed project name keeps one Postgres (and one volume) across worktrees.
name: split-pay

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: splitpay
      POSTGRES_PASSWORD: splitpay
      POSTGRES_DB: splitpay
    ports: ['5432:5432']
    volumes:
      # PG18 image: mount at /var/lib/postgresql, not /var/lib/postgresql/data.
      - pgdata:/var/lib/postgresql
      # Creates the test database on the first start of an empty volume.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U splitpay']
      interval: 2s
      retries: 20

volumes:
  pgdata:
