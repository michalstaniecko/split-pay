packages:
  - apps/*
  - packages/*

# React Native / Metro is most reliable with a flat node_modules
nodeLinker: hoisted

allowBuilds:
  esbuild: true
  # Its postinstall only re-downloads the binary that @sentry/cli-<platform> already ships.
  '@sentry/cli': false

permissions:
  tsdown:
    skills: false
  expo-sqlite:
    skills: false
