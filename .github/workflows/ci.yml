name: CI

# Per ADR-0015: Linux only, no mobile builds.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  # No paths-ignore here: `check` is a required status check in the `protect-main`
  # ruleset, so it must report on every PR (docs-only PRs would otherwise hang).
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # API tests run against a real Postgres (apps/api/test/).
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: splitpay
          POSTGRES_PASSWORD: splitpay
          POSTGRES_DB: splitpay_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U splitpay"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://splitpay:splitpay@localhost:5432/splitpay_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: pnpm turbo run typecheck test --cache-dir=.turbo
